name: Content Maintenance

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - '_incoming/articles/**'
      - 'tools/publish_article.py'
      - 'tools/sync_readme_articles.py'
      - 'tools/test_sync_readme_articles.py'
      - '.github/workflows/content-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-maintenance
  cancel-in-progress: false

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test article catalog generator
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Refresh generated article catalog
        run: python tools/sync_readme_articles.py
      - name: Commit catalog when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'README article catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh article catalog'
          git push origin HEAD:main

  sync-app-main:
    needs: refresh-readme
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/sync-main-content
    steps:
      - name: Checkout canonical content
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
          path: canonical
          fetch-depth: 1
      - name: Checkout Desktop branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: app-main
          path: desktop
          fetch-depth: 0
      - name: Synchronize canonical docs
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete canonical/docs/ desktop/docs/
          if git -C desktop diff --quiet -- docs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'app-main already contains the canonical docs tree.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Desktop dependencies
        if: steps.sync.outputs.changed == 'true'
        working-directory: desktop
        run: npm ci
      - name: Verify Desktop with synchronized content
        if: steps.sync.outputs.changed == 'true'
        working-directory: desktop
        run: npm run verify
      - name: Publish verified content with a regular merge commit
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha=$(git -C canonical rev-parse HEAD)
          cd desktop
          base_sha=$(git rev-parse HEAD)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git switch -C "$SYNC_BRANCH"
          git add docs
          git commit -m "docs: sync canonical content from main (${canonical_sha:0:12})"
          sync_sha=$(git rev-parse HEAD)
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

          git switch -C app-main "$base_sha"
          git merge --no-ff "$sync_sha" -m "Merge canonical content from main (${canonical_sha:0:12})"
          merge_sha=$(git rev-parse HEAD)
          git push origin HEAD:app-main

          {
            echo '### Desktop content synchronization'
            echo
            echo "- canonical main: \`$canonical_sha\`"
            echo "- retained sync branch: \`$SYNC_BRANCH\` at \`$sync_sha\`"
            echo "- app-main regular merge commit: \`$merge_sha\`"
            echo '- validation: `npm run verify` completed before publication'
          } >> "$GITHUB_STEP_SUMMARY"
