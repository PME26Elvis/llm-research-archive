name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Desktop source branch, tag, or commit SHA
        required: true
        default: app-main
      requested_version:
        description: Blank creates next free version; exact SemVer can promote a matching draft
        required: false
        default: ''
      release_notes:
        description: Optional changes; separate items with commas, semicolons, newlines, or Markdown bullets
        required: false
        default: ''
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - prerelease
          - stable
        default: prerelease
      publish:
        description: Publish after verification; false leaves a draft
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: PME26Elvis/llm-research-archive/.github/workflows/desktop-release-reusable.yml@app-main
    with:
      target_ref: ${{ inputs.target_ref }}
      requested_version: ${{ inputs.requested_version }}
      release_notes: ${{ inputs.release_notes }}
      channel: ${{ inputs.channel }}
      publish: ${{ inputs.publish }}
