name: Temporary Astro source snapshot inspector

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-astro-source-snapshot-inspector.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/astro-source-snapshot-receipt
          fetch-depth: 0
      - name: Record source snapshot run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Temporary Astro source snapshot" --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > .astro-source-snapshot-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > .astro-source-snapshot-artifacts.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .astro-source-snapshot-run.json .astro-source-snapshot-artifacts.json
          git commit -m "Record Astro source snapshot ${run_id}"
          git pull --rebase origin ops/astro-source-snapshot-receipt
          git push origin HEAD:ops/astro-source-snapshot-receipt
