name: Temporary Astro dual-renderer applicator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-apply-astro-dual-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/complete-astro-dual-renderer
          fetch-depth: 0
      - name: Checkout verified payload
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/astro-dual-renderer-payload
          path: .payload
          fetch-depth: 1
      - name: Validate payload part 00
        run: echo '35abf375d3ef2313df6c4a299721de1c62f7cc7abb2ba8668806b02b6a3544c0  .payload/.astro-payload/00.part' | sha256sum --check
      - name: Validate payload part 01
        run: echo 'bb16cc66439f62e20a3c510f3cfcc191b90e6adf74c121d7533cf5817b279ef3  .payload/.astro-payload/01.part' | sha256sum --check
      - name: Validate payload part 02
        run: echo 'e7b439940416234a6495dbdf84c38867f2f85f310362e9192d369aaac3164999  .payload/.astro-payload/02.part' | sha256sum --check
      - name: Validate payload part 03
        run: echo '5db5d8175366d06f3b616b7b0d3ab359f4664edf5b83d37dbf212440019ae8e6  .payload/.astro-payload/03.part' | sha256sum --check
      - name: Validate payload part 04
        run: echo '720173b84053d486579ce58676441d02f95aff5884a849bd5a78c075810f49aa  .payload/.astro-payload/04.part' | sha256sum --check
      - name: Validate payload part 05
        run: echo '8bc82651d4c41c15aacf291b889d3557f6d9861187e03e6341b64d3eaabb71fe  .payload/.astro-payload/05.part' | sha256sum --check
      - name: Validate payload part 06
        run: echo 'ac75ba4c84364e7cf2f8b21984057202cde904eb046ca9793c1941462df7f51e  .payload/.astro-payload/06.part' | sha256sum --check
      - name: Validate payload part 07
        run: echo 'f5e08ac1b2bc8b845d078dece386fb48aa11192c5f856cb1ec9db088b505d124  .payload/.astro-payload/07.part' | sha256sum --check
      - name: Validate payload part 08
        run: echo '8bfa3151dcb8895b329329f249d97121a3ec7d3bd782e13cba6d384a76fd2b62  .payload/.astro-payload/08.part' | sha256sum --check
      - name: Reconstruct encoded payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/.astro-payload/*.part > /tmp/astro-dual-renderer.patch.gz.b64
          test "$(wc -c < /tmp/astro-dual-renderer.patch.gz.b64)" -eq 69852
          echo 'a2556837e1c8a0619c680ca9734b7d09a6cb4baa846eac8a31c3860680080bc4  /tmp/astro-dual-renderer.patch.gz.b64' | sha256sum --check
      - name: Decode compressed payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/astro-dual-renderer.patch.gz.b64 > /tmp/astro-dual-renderer.patch.gz
          gzip --test /tmp/astro-dual-renderer.patch.gz
      - name: Verify reconstructed patch
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout /tmp/astro-dual-renderer.patch.gz > /tmp/astro-dual-renderer.patch
          test "$(wc -c < /tmp/astro-dual-renderer.patch)" -eq 214813
          echo 'e76dce77a5ec9e0b37554f994955a2b01c20af072b4336e768f85eb63ebe5000  /tmp/astro-dual-renderer.patch' | sha256sum --check
      - name: Validate patch applicability
        run: git apply --check /tmp/astro-dual-renderer.patch
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/astro-dual-renderer.patch
          rm -rf .payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate public npm lockfile
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Format implementation
        run: npm run format:write
      - name: Create implementation commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement retained Astro and Classic renderer entries'
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Execute complete repository quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee astro-dual-renderer-verify.log
      - name: Require clean verified tree
        shell: bash
        run: git diff --exit-code && test -z "$(git status --short)"
      - name: Push verified implementation
        run: git push origin HEAD:agent/complete-astro-dual-renderer
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astro-dual-renderer-apply-${{ github.run_attempt }}
          path: |
            astro-dual-renderer-verify.log
            coverage/
            dist/quality/
            dist/performance/
          if-no-files-found: warn
          retention-days: 14

  receipt:
    if: always()
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/astro-dual-renderer-apply-receipt
          fetch-depth: 0
      - name: Record applicator result
        env:
          APPLY_RUN_ID: ${{ github.run_id }}
          APPLY_RESULT: ${{ needs.apply.result }}
          VERIFIED_COMMIT_SHA: ${{ needs.apply.outputs.commit_sha }}
          APPLY_TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.APPLY_RUN_ID),
            result: process.env.APPLY_RESULT,
            verifiedCommitSha: process.env.VERIFIED_COMMIT_SHA || null,
            triggerSha: process.env.APPLY_TRIGGER_SHA,
            targetBranch: 'agent/complete-astro-dual-renderer',
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.astro-dual-renderer-apply.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .astro-dual-renderer-apply.json
          git commit -m "Record Astro dual-renderer applicator ${APPLY_RUN_ID}"
          git pull --rebase origin ops/astro-dual-renderer-apply-receipt
          git push origin HEAD:ops/astro-dual-renderer-apply-receipt
