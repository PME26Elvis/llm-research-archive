name: Temporary Astro dual-renderer prerelease publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v0.1.5-astro-dual-renderer-release.yml

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: PME26Elvis/llm-research-archive/.github/workflows/desktop-release-reusable.yml@app-main
    with:
      target_ref: app-main
      requested_version: '0.1.5'
      release_notes: |
        Ship Astro Observatory as the default static-first renderer
        Retain Classic Observatory as a persistent first-class renderer entry
        Package both renderer implementations in every supported desktop artifact
        Add typed renderer switching with native menu controls and safe fallback
        Verify file-relative Astro chunks Mermaid CSP and complete Electron parity
      channel: prerelease
      publish: true

  receipt:
    if: always()
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/v0.1.5-release-receipt
          fetch-depth: 0
      - name: Record release result
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.RELEASE_RUN_ID),
            result: process.env.RELEASE_RESULT,
            triggerSha: process.env.RELEASE_TRIGGER_SHA,
            targetRef: 'app-main',
            expectedVersion: 'v0.1.5',
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.v0.1.5-release-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v0.1.5-release-receipt.json
          git commit -m "Record Astro dual-renderer prerelease ${RELEASE_RUN_ID}"
          git pull --rebase origin ops/v0.1.5-release-receipt
          git push origin HEAD:ops/v0.1.5-release-receipt
