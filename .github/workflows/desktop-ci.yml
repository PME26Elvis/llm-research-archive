name: Desktop CI
on:
  push:
    branches: [agent/lazy-syntax-highlighting]
permissions:
  contents: write
jobs:
  finalize-syntax-highlighting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/lazy-syntax-highlighting
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Install and update lockfile
        run: npm install --ignore-scripts
      - name: Synchronize FR-015 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('project-docs/product/desktop-product-spec.md'): [
                  ('  - ADR-0009\n', '  - ADR-0009\n  - ADR-0010\n'),
                  ('## FR-015\n\nStatus: `planned`. Verification: planned for a later PR.',
                   '## FR-015\n\nStatus: `implemented`. Verification: apps/desktop-electron/src/renderer/syntax-highlight.test.ts, apps/desktop-electron/e2e/syntax-highlight.spec.ts.'),
              ],
              Path('project-docs/traceability/requirements.yaml'): [
                  ('- {id: FR-015, title: FR-015, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-015}, implementation: {packages: *p}, verification: {tests: []}, status: planned}',
                   '- {id: FR-015, title: FR-015, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-015}, implementation: {packages: *p}, verification: {tests: [apps/desktop-electron/src/renderer/syntax-highlight.test.ts, apps/desktop-electron/e2e/syntax-highlight.spec.ts]}, status: implemented}'),
              ],
              Path('project-docs/quality/acceptance-matrix.md'): [
                  ('| FR-015 | planned | planned |',
                   '| FR-015 | implemented | apps/desktop-electron/src/renderer/syntax-highlight.test.ts, apps/desktop-electron/e2e/syntax-highlight.spec.ts |'),
              ],
              Path('project-docs/migration/mkdocs-feature-parity-matrix.md'): [
                  ('| Syntax highlighting | MkDocs | renderer | planned | planned | Sanitized code blocks exist; highlighting is later. |',
                   '| Syntax highlighting | MkDocs | renderer | implemented | apps/desktop-electron/src/renderer/syntax-highlight.test.ts; apps/desktop-electron/e2e/syntax-highlight.spec.ts | Registered local grammars highlight near the viewport without auto-detection, while unknown languages remain plain text. |'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Apply repository formatting
        run: npm run format:write
      - name: Commit generated lockfile and formatted implementation
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json \
              apps/desktop-electron/src/renderer/renderer.tsx \
              apps/desktop-electron/src/renderer/syntax-highlight.ts \
              apps/desktop-electron/src/renderer/syntax-highlight.test.ts \
              apps/desktop-electron/src/renderer/syntax-highlight.css \
              apps/desktop-electron/e2e/syntax-highlight.spec.ts \
              project-docs/architecture/adr/0010-bounded-local-syntax-highlighting.md \
              project-docs/product/desktop-product-spec.md \
              project-docs/traceability/requirements.yaml \
              project-docs/quality/acceptance-matrix.md \
              project-docs/migration/mkdocs-feature-parity-matrix.md
            git commit -m "feat(reader): finalize lazy syntax highlighting"
            git push origin HEAD:agent/lazy-syntax-highlighting
          fi
