name: Desktop CI
on:
  push:
    branches: [app-main, main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Formatting
        shell: bash
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee prettier-check.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-formatting-diagnostics-${{ github.run_attempt }}
          path: prettier-check.log
          if-no-files-found: error
          retention-days: 14
      - name: Architecture
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Traceability
        run: npm run validate:traceability
      - name: Generated content
        run: npm run validate:generated
      - name: Release assets
        run: npm run validate:release-assets
      - name: Unit tests
        run: npm run test
      - name: Security tests
        run: npm run test:security
      - name: Compatibility tests
        run: npm run test:compatibility
      - name: Build
        run: npm run build
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libatk-bridge2.0-0 libxss1
      - run: npm ci
      - run: npm run build
      - name: Electron E2E
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run test:e2e 2>&1 | tee playwright-e2e.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-e2e-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-e2e.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
  package-smoke:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: windows-latest,
              command: "make:windows",
              artifact: desktop-windows-x64,
            }
          - {
              os: ubuntu-latest,
              command: "make:linux",
              artifact: desktop-linux-x64,
            }
          - {
              os: macos-15,
              command: "make:macos:arm64",
              artifact: desktop-macos-arm64,
            }
          - {
              os: macos-15-intel,
              command: "make:macos:x64",
              artifact: desktop-macos-x64,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb libgtk-3-0 libnss3 libasound2t64 libatk-bridge2.0-0 libxss1
      - run: npm ci
      - run: npm run ${{ matrix.command }}
        env:
          RELEASE_TARGET_COMMIT: ${{ github.sha }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged
      - if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/release-assets/*
