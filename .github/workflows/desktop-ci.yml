name: Finalize Native Commands
on:
  push:
    branches: [agent/native-command-palette]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: python scripts/apply-pr24.py
      - run: rm scripts/apply-pr24.py
      - run: npm ci
      - run: npm run format:write
      - run: npm run typecheck
      - run: npm run test -- --run packages/platform-contracts/src/desktop-command.test.ts apps/desktop-electron/src/renderer/desktop-commands.test.ts
      - run: npm run validate:traceability
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Integrate typed native commands and palette"
          git push
