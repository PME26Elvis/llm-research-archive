name: Desktop CI
on:
  push:
    branches: [app-main, main]
  pull_request:
permissions:
  contents: read
jobs:
  e2e-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libatk-bridge2.0-0 libxss1
      - run: npm ci
      - run: npm run build
      - name: Capture E2E output
        run: |
          set +e
          xvfb-run -a npm run test:e2e > e2e.log 2>&1
          status=$?
          echo "$status" > e2e-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mermaid-e2e-diagnostics
          path: |
            e2e.log
            e2e-exit-code.txt
            test-results
          if-no-files-found: warn
