name: Finalize Native Commands
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'agent/native-command-palette' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/native-command-palette
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Apply integration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-pr24.py')
          text = path.read_text()
          text = text.replace("apps/desktop-electron/src/main/preload.ts", "apps/desktop-electron/src/preload/preload.ts")
          text = text.replace("if travel not in r:\n    raise SystemExit('travel history marker missing')\n", '')
          text = text.replace("if load_marker not in r:\n    raise SystemExit('list effect marker missing')\n", '')
          path.write_text(text)
          PY
          python scripts/apply-pr24.py
          rm scripts/apply-pr24.py
      - run: npm ci
      - run: npm run format:write
      - name: TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-command-typecheck-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 2
      - name: Stop after typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: rm typecheck.log
      - run: npm run test -- --run packages/platform-contracts/src/desktop-command.test.ts apps/desktop-electron/src/renderer/desktop-commands.test.ts
      - run: npm run validate:traceability
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Integrate typed native commands and palette"
          git push origin HEAD:agent/native-command-palette
