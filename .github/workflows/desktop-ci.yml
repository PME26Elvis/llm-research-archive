name: Desktop CI
on:
  push:
    branches: [app-main, main]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Finalize Mermaid integration
        run: |
          npm install --save-dev --save-exact mermaid@11.16.0
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/desktop-electron/src/renderer/renderer.tsx'): [
                  (
                      "import { copyText } from './copy-code';\n",
                      "import { copyText } from './copy-code';\nimport { mountMermaidBlocks } from './mermaid-dom';\n",
                  ),
                  (
                      "    decorateCodeBlocks(reader);\n  }, [selected]);\n",
                      "    const cleanupMermaid = mountMermaidBlocks(reader);\n    decorateCodeBlocks(reader);\n    return cleanupMermaid;\n  }, [selected]);\n",
                  ),
              ],
              Path('project-docs/quality/acceptance-matrix.md'): [
                  (
                      '| FR-014 | planned | planned |',
                      '| FR-014 | implemented | apps/desktop-electron/src/renderer/mermaid-renderer.test.ts, apps/desktop-electron/e2e/mermaid.spec.ts |',
                  ),
                  ('last-verified: 2026-07-10', 'last-verified: 2026-07-11'),
              ],
              Path('project-docs/traceability/requirements.yaml'): [
                  (
                      '- {id: FR-014, title: FR-014, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-014}, implementation: {packages: *p}, verification: {tests: []}, status: planned}',
                      '- {id: FR-014, title: FR-014, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-014}, implementation: {packages: *p}, verification: {tests: [apps/desktop-electron/src/renderer/mermaid-renderer.test.ts, apps/desktop-electron/e2e/mermaid.spec.ts]}, status: implemented}',
                  ),
              ],
              Path('project-docs/product/desktop-product-spec.md'): [
                  (
                      'related-adrs:\n  - ADR-0001\n',
                      'related-adrs:\n  - ADR-0001\n  - ADR-0009\n',
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          npm run format:write
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json apps/desktop-electron/src/renderer/renderer.tsx project-docs/product/desktop-product-spec.md project-docs/quality/acceptance-matrix.md project-docs/traceability/requirements.yaml
            git commit -m "chore(renderer): finalize Mermaid integration"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Architecture
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Traceability
        run: npm run validate:traceability
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
