name: Finalize Local Workspace
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'agent/local-workspace-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/local-workspace-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Repair and compile finalizer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-pr25.py')
          text = path.read_text()
          start = text.index("q = replace_once(\n    q,\n    \"  openExternal:")
          end = text.index('preload.write_text(q)', start)
          replacement = '''q = replace_once(
              q,
              "  openExternal: (url: string) => ipcRenderer.invoke('external:open', url),",
              """  openExternal: (url: string) => ipcRenderer.invoke('external:open', url),
            workspaceInfo: async (): Promise<WorkspaceInfoDto> =>
              WorkspaceInfoSchema.parse(await ipcRenderer.invoke('workspace:info')),
            selectWorkspace: async (): Promise<WorkspaceSelectionResult> =>
              WorkspaceSelectionResultSchema.parse(await ipcRenderer.invoke('workspace:select')),
          """,
              'preload workspace methods',
          )
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python -m py_compile scripts/apply-pr25.py
      - name: Apply workspace integration
        run: python scripts/apply-pr25.py
      - name: Remove finalization script
        run: rm scripts/apply-pr25.py
      - run: npm ci
      - name: Format repository
        run: npm run format:write
      - name: TypeScript
        run: npm run typecheck
      - name: Focused workspace tests
        run: npm run test -- --run packages/content-engine/src/index.test.ts apps/desktop-electron/src/main/workspace-state.test.ts packages/platform-contracts/src/workspace-contract.test.ts
      - name: Security tests
        run: npm run test:security
      - name: Traceability
        run: npm run validate:traceability
      - name: Commit finalized workspace feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Integrate validated persistent local workspaces"
          git push origin HEAD:agent/local-workspace-foundation
