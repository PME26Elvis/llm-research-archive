name: Desktop CI
on:
  push:
    branches: [app-main, main]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Apply formatting to Mermaid files
        run: |
          npm run format:write
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop-electron/e2e/mermaid.spec.ts \
              apps/desktop-electron/src/renderer/mermaid-dom.ts \
              apps/desktop-electron/src/renderer/mermaid-renderer.ts \
              apps/desktop-electron/src/renderer/mermaid-renderer.test.ts
            git commit -m "style(renderer): format Mermaid integration"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Formatting
        run: npm run format:check
      - name: Architecture
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Traceability
        run: npm run validate:traceability
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
