name: Desktop CI
on:
  pull_request:
permissions:
  contents: write
jobs:
  format-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Apply repository formatting
        run: |
          npm run format:write
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add playwright.config.ts package.json \
              apps/desktop-electron/e2e/electron-test.ts \
              apps/desktop-electron/e2e/source.spec.ts \
              apps/desktop-electron/e2e/mermaid.spec.ts \
              .github/workflows/desktop-ci.yml
            git commit -m "style(test): format Playwright diagnostics"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
