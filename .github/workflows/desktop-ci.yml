name: Finalize Native Commands
on:
  pull_request:
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'agent/native-command-palette' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/native-command-palette
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Run integration script with traceback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-pr24.py')
          text = path.read_text()
          text = text.replace("if travel not in r:\n    raise SystemExit('travel history marker missing')\n", '')
          text = text.replace("if load_marker not in r:\n    raise SystemExit('list effect marker missing')\n", '')
          path.write_text(text)
          PY
          set +e
          python scripts/apply-pr24.py > integration.log 2>&1
          status=$?
          echo '--- integration traceback (last 80 lines) ---'
          tail -80 integration.log
          exit $status
      - run: rm scripts/apply-pr24.py integration.log
      - run: npm ci
      - run: npm run format:write
      - run: npm run typecheck
      - run: npm run test -- --run packages/platform-contracts/src/desktop-command.test.ts apps/desktop-electron/src/renderer/desktop-commands.test.ts
      - run: npm run validate:traceability
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Integrate typed native commands and palette"
          git push origin HEAD:agent/native-command-palette
