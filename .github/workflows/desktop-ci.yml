name: Desktop CI
on:
  push:
    branches: [agent/persistent-reader-preferences]
permissions:
  contents: write
jobs:
  finalize-preferences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/persistent-reader-preferences
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Integrate settings and traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('apps/desktop-electron/src/renderer/reader-settings.tsx')
          text = settings.read_text()
          old = "  loadReaderPreferences,\n  saveReaderPreferences,"
          new = "  loadReaderPreferences,\n  resolveTheme,\n  saveReaderPreferences,"
          if old not in text:
              raise SystemExit('settings import anchor missing')
          text = text.replace(old, new, 1)
          old = "  const buttonRef = useRef<HTMLButtonElement>(null);\n\n  useEffect(() => {"
          new = "  const buttonRef = useRef<HTMLButtonElement>(null);\n  const resolvedThemeRef = useRef(resolveTheme(initialPreferences.theme, systemTheme.matches));\n\n  useEffect(() => {"
          if old not in text:
              raise SystemExit('settings ref anchor missing')
          text = text.replace(old, new, 1)
          old = "  useEffect(() => {\n    applyReaderPreferences(document, preferences, systemPrefersDark);\n    saveReaderPreferences(window.localStorage, preferences);\n  }, [preferences, systemPrefersDark]);"
          new = "  useEffect(() => {\n    applyReaderPreferences(document, preferences, systemPrefersDark);\n    saveReaderPreferences(window.localStorage, preferences);\n    const resolved = resolveTheme(preferences.theme, systemPrefersDark);\n    if (resolved !== resolvedThemeRef.current) {\n      resolvedThemeRef.current = resolved;\n      document.dispatchEvent(new Event('observatory-theme-change'));\n    }\n  }, [preferences, systemPrefersDark]);"
          if old not in text:
              raise SystemExit('settings effect anchor missing')
          settings.write_text(text.replace(old, new, 1))

          renderer = Path('apps/desktop-electron/src/renderer/renderer.tsx')
          text = renderer.read_text()
          old = "import { mountMermaidBlocks } from './mermaid-dom';\nimport { mountSyntaxHighlighting } from './syntax-highlight';"
          new = "import { mountMermaidBlocks } from './mermaid-dom';\nimport { ReaderSettings } from './reader-settings';\nimport { mountSyntaxHighlighting } from './syntax-highlight';"
          if old not in text:
              raise SystemExit('renderer import anchor missing')
          text = text.replace(old, new, 1)
          old = "          <h1>Research Observatory</h1>\n          <button ref={aboutButtonRef} type=\"button\" onClick={openAbout}>\n            關於\n          </button>"
          new = "          <h1>Research Observatory</h1>\n          <div className=\"app-header-actions\">\n            <ReaderSettings />\n            <button ref={aboutButtonRef} type=\"button\" onClick={openAbout}>\n              關於\n            </button>\n          </div>"
          if old not in text:
              raise SystemExit('renderer header anchor missing')
          renderer.write_text(text.replace(old, new, 1))

          fixture = Path('apps/desktop-electron/e2e/electron-test.ts')
          text = fixture.read_text()
          old = "interface LaunchElectronOptions {\n  env?: Record<string, string>;\n  cleanupPaths?: string[];\n}"
          new = "interface LaunchElectronOptions {\n  env?: Record<string, string>;\n  args?: string[];\n  cleanupPaths?: string[];\n}"
          if old not in text:
              raise SystemExit('fixture interface anchor missing')
          text = text.replace(old, new, 1)
          old = "        args: ['.', '--no-sandbox'],"
          new = "        args: ['.', '--no-sandbox', ...(options.args ?? [])],"
          if old not in text:
              raise SystemExit('fixture args anchor missing')
          fixture.write_text(text.replace(old, new, 1))

          e2e = Path('apps/desktop-electron/e2e/preferences.spec.ts')
          text = e2e.read_text().replace("Control++", "Control+=")
          e2e.write_text(text)

          replacements = {
              Path('project-docs/product/desktop-product-spec.md'): [
                  ('  - ADR-0011\n', '  - ADR-0011\n  - ADR-0012\n'),
                  ('accessible footnotes, native packaging',
                   'accessible footnotes, persistent theme and text preferences, native packaging'),
                  ('## FR-017\n\nStatus: `planned`. Verification: planned for a later PR.',
                   '## FR-017\n\nStatus: `implemented`. Verification: apps/desktop-electron/src/renderer/preferences.test.ts, apps/desktop-electron/e2e/preferences.spec.ts.'),
              ],
              Path('project-docs/traceability/requirements.yaml'): [
                  ('- {id: FR-017, title: FR-017, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-017}, implementation: {packages: *p}, verification: {tests: []}, status: planned}',
                   '- {id: FR-017, title: FR-017, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-017}, implementation: {packages: *p}, verification: {tests: [apps/desktop-electron/src/renderer/preferences.test.ts, apps/desktop-electron/e2e/preferences.spec.ts]}, status: implemented}'),
              ],
              Path('project-docs/quality/acceptance-matrix.md'): [
                  ('| FR-017 | planned | planned |',
                   '| FR-017 | implemented | apps/desktop-electron/src/renderer/preferences.test.ts, apps/desktop-electron/e2e/preferences.spec.ts |'),
              ],
              Path('project-docs/migration/mkdocs-feature-parity-matrix.md'): [
                  ('| Dark mode | CSS | renderer | planned | planned | Current styling is fixed dark reader. |',
                   '| Dark mode | CSS | renderer | implemented | apps/desktop-electron/src/renderer/preferences.test.ts; apps/desktop-electron/e2e/preferences.spec.ts | System, light, and dark themes persist with bounded article text scaling and theme-aware code, Mermaid, and footnotes. |'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Apply repository formatting
        run: npm run format:write
      - name: Commit finalized preferences
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/desktop-electron/src/renderer/preferences.ts \
              apps/desktop-electron/src/renderer/preferences.test.ts \
              apps/desktop-electron/src/renderer/reader-settings.tsx \
              apps/desktop-electron/src/renderer/renderer.tsx \
              apps/desktop-electron/src/renderer/style.css \
              apps/desktop-electron/src/renderer/syntax-highlight.css \
              apps/desktop-electron/src/renderer/footnotes.css \
              apps/desktop-electron/src/renderer/mermaid.css \
              apps/desktop-electron/src/renderer/mermaid-renderer.ts \
              apps/desktop-electron/src/renderer/mermaid-renderer.test.ts \
              apps/desktop-electron/src/renderer/mermaid-dom.ts \
              apps/desktop-electron/e2e/electron-test.ts \
              apps/desktop-electron/e2e/preferences.spec.ts \
              project-docs/architecture/adr/0012-versioned-renderer-preferences.md \
              project-docs/product/desktop-product-spec.md \
              project-docs/traceability/requirements.yaml \
              project-docs/quality/acceptance-matrix.md \
              project-docs/migration/mkdocs-feature-parity-matrix.md
            git commit -m "feat(settings): finalize persistent reader preferences"
            git push origin HEAD:agent/persistent-reader-preferences
          fi
