name: Desktop CI
on:
  push:
    branches: [agent/accessible-footnotes]
permissions:
  contents: write
jobs:
  finalize-footnotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/accessible-footnotes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Install pinned footnote plugin
        run: npm install --save-dev --save-exact markdown-it-footnote@4.0.0 --ignore-scripts
      - name: Integrate footnote lifecycle and traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('apps/desktop-electron/src/renderer/renderer.tsx')
          text = renderer.read_text()
          old = "import { mountMermaidBlocks } from './mermaid-dom';\nimport { mountSyntaxHighlighting } from './syntax-highlight';"
          new = "import { mountFootnoteNavigation } from './footnotes';\nimport { mountMermaidBlocks } from './mermaid-dom';\nimport { mountSyntaxHighlighting } from './syntax-highlight';"
          if old not in text:
              raise SystemExit('renderer import anchor missing')
          text = text.replace(old, new, 1)
          old = "    const cleanupHighlighting = mountSyntaxHighlighting(reader);\n    return () => {\n      cleanupHighlighting();\n      cleanupMermaid();\n    };"
          new = "    const cleanupHighlighting = mountSyntaxHighlighting(reader);\n    const cleanupFootnotes = mountFootnoteNavigation(reader);\n    return () => {\n      cleanupFootnotes();\n      cleanupHighlighting();\n      cleanupMermaid();\n    };"
          if old not in text:
              raise SystemExit('renderer lifecycle anchor missing')
          renderer.write_text(text.replace(old, new, 1))

          replacements = {
              Path('project-docs/product/desktop-product-spec.md'): [
                  ('  - ADR-0010\n', '  - ADR-0010\n  - ADR-0011\n'),
                  ('strict lazy Mermaid rendering, native packaging',
                   'strict lazy Mermaid rendering, lazy syntax highlighting, accessible footnotes, native packaging'),
                  ('## FR-016\n\nStatus: `planned`. Verification: planned for a later PR.',
                   '## FR-016\n\nStatus: `implemented`. Verification: packages/renderer-ui/src/index.test.ts, apps/desktop-electron/e2e/footnotes.spec.ts.'),
              ],
              Path('project-docs/traceability/requirements.yaml'): [
                  ('- {id: FR-016, title: FR-016, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-016}, implementation: {packages: *p}, verification: {tests: []}, status: planned}',
                   '- {id: FR-016, title: FR-016, priority: P2, source: {document: project-docs/product/desktop-product-spec.md, section: FR-016}, implementation: {packages: *p}, verification: {tests: [packages/renderer-ui/src/index.test.ts, apps/desktop-electron/e2e/footnotes.spec.ts]}, status: implemented}'),
              ],
              Path('project-docs/quality/acceptance-matrix.md'): [
                  ('| FR-016 | planned | planned |',
                   '| FR-016 | implemented | packages/renderer-ui/src/index.test.ts, apps/desktop-electron/e2e/footnotes.spec.ts |'),
              ],
              Path('project-docs/migration/mkdocs-feature-parity-matrix.md'): [
                  ('| Footnotes | Markdown | renderer | planned | planned | Markdown-it default coverage only. |',
                   '| Footnotes | Markdown | renderer | implemented | packages/renderer-ui/src/index.test.ts; apps/desktop-electron/e2e/footnotes.spec.ts | Named, inline, multi-block, and repeated footnotes use deterministic accessible in-app navigation. |'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Apply repository formatting
        run: npm run format:write
      - name: Commit finalized footnotes
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json \
              packages/renderer-ui/src/index.ts \
              packages/renderer-ui/src/index.test.ts \
              packages/renderer-ui/src/markdown-it-footnote.d.ts \
              apps/desktop-electron/src/renderer/renderer.tsx \
              apps/desktop-electron/src/renderer/footnotes.ts \
              apps/desktop-electron/src/renderer/footnotes.css \
              apps/desktop-electron/e2e/footnotes.spec.ts \
              project-docs/architecture/adr/0011-accessible-markdown-footnotes.md \
              project-docs/product/desktop-product-spec.md \
              project-docs/traceability/requirements.yaml \
              project-docs/quality/acceptance-matrix.md \
              project-docs/migration/mkdocs-feature-parity-matrix.md
            git commit -m "feat(reader): finalize accessible footnotes"
            git push origin HEAD:agent/accessible-footnotes
          fi
