name: Temporary Patch Release Draft Discovery
run-name: Patch release draft discovery permission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-patch-release-draft-discovery.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch release draft discovery permission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/release-draft-discovery-permission
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - name: Apply release workflow patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/desktop-release-reusable.yml')
          text = workflow.read_text()
          old = "  preflight:\n    runs-on: ubuntu-latest\n"
          new = "  preflight:\n    permissions:\n      contents: write\n    runs-on: ubuntu-latest\n"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('unable to locate unique preflight job header')
              text = text.replace(old, new, 1)
          workflow.write_text(text)

          validation = Path('scripts/validate-release-assets.mjs')
          text = validation.read_text()
          marker = "if (releaseWorkflow.includes('npm version \"$RELEASE_VERSION\"')) {\n  throw new Error('release workflow must not use shell-specific RELEASE_VERSION expansion');\n}\n"
          addition = r"""
          const preflightStart = releaseWorkflow.indexOf('  preflight:\n');
          const buildStart = releaseWorkflow.indexOf('  build:\n');
          if (preflightStart < 0 || buildStart <= preflightStart) {
            throw new Error('release workflow must contain ordered preflight and build jobs');
          }
          const preflightWorkflow = releaseWorkflow.slice(preflightStart, buildStart);
          if (!preflightWorkflow.includes('    permissions:\n      contents: write\n')) {
            throw new Error('release preflight needs contents: write to discover draft releases');
          }
          if (!preflightWorkflow.includes('/releases?per_page=100')) {
            throw new Error('release preflight must enumerate GitHub releases before selecting a version');
          }
          """.lstrip()
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('unable to locate release workflow validation marker')
              text = text.replace(marker, marker + addition, 1)
          validation.write_text(text)
          PY
      - run: npm ci
      - run: npm run format:write
      - run: npm run verify
      - name: Publish verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/desktop-release-reusable.yml scripts/validate-release-assets.mjs
          git commit -m "Fix draft-aware release version selection"
          git push origin HEAD:fix/release-draft-discovery-permission
