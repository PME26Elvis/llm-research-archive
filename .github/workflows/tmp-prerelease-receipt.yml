name: Temporary Completed Prerelease Receipt
run-name: Record completed app-main prerelease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-prerelease-receipt.yml
  workflow_run:
    workflows:
      - Completed Desktop Prerelease
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/completed-prerelease-receipt
          fetch-depth: 0
      - name: Resolve and await the prerelease workflow
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_RUN_ID:-}" && "${EVENT_RUN_ID}" != "null" ]]; then
            run_id="${EVENT_RUN_ID}"
          else
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&per_page=50" \
              --jq '.workflow_runs | map(select(.name == "Completed Desktop Prerelease")) | sort_by(.created_at) | reverse | .[0].id')
          fi
          if [[ -z "${run_id:-}" || "${run_id}" == "null" ]]; then
            echo 'unable to locate Completed Desktop Prerelease workflow run' >&2
            exit 1
          fi
          for _ in $(seq 1 90); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            if [[ "${status}" == "completed" ]]; then
              break
            fi
            sleep 20
          done
          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
          if [[ "${status}" != "completed" ]]; then
            echo "release workflow ${run_id} did not complete within the monitor window" >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/release-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/release-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > /tmp/releases.json
      - name: Record workflow and release evidence
        env:
          RELEASE_RUN_ID: ${{ steps.monitor.outputs.run_id }}
          TARGET_SHA: 939e76513979b90f0678d9068810e4218a5108fd
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('/tmp/release-run.json', 'utf8'));
          const jobs = JSON.parse(fs.readFileSync('/tmp/release-jobs.json', 'utf8')).jobs ?? [];
          const releases = JSON.parse(fs.readFileSync('/tmp/releases.json', 'utf8'));
          const targetSha = process.env.TARGET_SHA;
          const startedAt = new Date(run.created_at).getTime();
          const release = releases.find((candidate) =>
            candidate.prerelease &&
            !candidate.draft &&
            (candidate.target_commitish === targetSha ||
              (candidate.published_at && new Date(candidate.published_at).getTime() >= startedAt)),
          ) ?? null;
          const receipt = {
            schemaVersion: 1,
            recordedAt: new Date().toISOString(),
            targetSha,
            workflow: {
              id: run.id,
              name: run.name,
              displayTitle: run.display_title,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              htmlUrl: run.html_url,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              runAttempt: run.run_attempt,
            },
            jobs: jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              htmlUrl: job.html_url,
            })),
            release: release
              ? {
                  id: release.id,
                  tagName: release.tag_name,
                  name: release.name,
                  htmlUrl: release.html_url,
                  targetCommitish: release.target_commitish,
                  draft: release.draft,
                  prerelease: release.prerelease,
                  publishedAt: release.published_at,
                  assets: release.assets.map((asset) => ({
                    name: asset.name,
                    size: asset.size,
                    downloadCount: asset.download_count,
                  })),
                }
              : null,
          };
          fs.writeFileSync('.completed-prerelease-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .completed-prerelease-receipt.json
          git commit -m "Record completed prerelease ${RELEASE_RUN_ID}"
          git pull --rebase origin ops/completed-prerelease-receipt
          git push origin HEAD:ops/completed-prerelease-receipt
      - name: Verify published prerelease evidence
        run: |
          node - <<'NODE'
          const receipt = require('./.completed-prerelease-receipt.json');
          if (receipt.workflow.status !== 'completed' || receipt.workflow.conclusion !== 'success') {
            throw new Error(`release workflow did not succeed: ${receipt.workflow.conclusion}`);
          }
          if (!receipt.release || receipt.release.draft || !receipt.release.prerelease) {
            throw new Error('published prerelease evidence is missing');
          }
          if (receipt.release.assets.length !== 10) {
            throw new Error(`expected 10 release assets, got ${receipt.release.assets.length}`);
          }
          if (receipt.release.assets.some((asset) => !asset.size)) {
            throw new Error('release contains an empty asset');
          }
          console.log(`verified ${receipt.release.tagName} with ${receipt.release.assets.length} assets`);
          NODE
