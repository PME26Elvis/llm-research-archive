name: Temporary Format Capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Capture Prettier changes
        run: |
          npm run format:write
          git diff --name-only > prettier-files.txt
          git diff --binary > prettier.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-prettier-capture
          path: |
            prettier-files.txt
            prettier.patch
          retention-days: 1
