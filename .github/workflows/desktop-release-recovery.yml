name: Desktop Release Recovery
run-name: Verified draft-aware Desktop Release from latest app-main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-release-recovery.yml

permissions:
  contents: read

jobs:
  release:
    if: github.event.head_commit.message == 'Trigger verified draft-aware Desktop Release'
    permissions:
      contents: write
    uses: PME26Elvis/llm-research-archive/.github/workflows/desktop-release-reusable.yml@app-main
    with:
      target_ref: app-main
      requested_version: ''
      channel: prerelease
      publish: true

  receipt:
    if: always()
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/fresh-release-recovery
          fetch-depth: 0
      - name: Write recovery receipt
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_RESULT: ${{ needs.release.result }}
          RECOVERY_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.RECOVERY_RUN_ID),
            result: process.env.RECOVERY_RESULT,
            triggerSha: process.env.RECOVERY_TRIGGER_SHA,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.release-recovery-status.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Publish recovery receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-recovery-status.json
          git commit -m "Record Desktop Release recovery ${{ github.run_id }}"
          git push origin HEAD:fix/fresh-release-recovery
