name: Temporary bilingual prerelease publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-i18n-source-snapshot.yml

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: PME26Elvis/llm-research-archive/.github/workflows/desktop-release-reusable.yml@app-main
    with:
      target_ref: app-main
      requested_version: ''
      release_notes: |
        Add system, Traditional Chinese, and English interface language settings
        Localize native menus, dialogs, command palette, Observatory, reader, and Import Wizard
        Persist language selection across restart with typed locale IPC and accessibility coverage
        Add structured Markdown release descriptions from concise change lists
        Synchronize all 58 implemented requirements and localization development documentation
      channel: prerelease
      publish: true

  receipt:
    if: always()
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/v0.1.3-release-receipt
          fetch-depth: 0
      - name: Record release result
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.RELEASE_RUN_ID),
            result: process.env.RELEASE_RESULT,
            triggerSha: process.env.RELEASE_TRIGGER_SHA,
            targetRef: 'app-main',
            expectedVersion: 'v0.1.3',
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.v0.1.3-release-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v0.1.3-release-receipt.json
          git commit -m "Record bilingual prerelease ${RELEASE_RUN_ID}"
          git pull --rebase origin ops/v0.1.3-release-receipt
          git push origin HEAD:ops/v0.1.3-release-receipt
