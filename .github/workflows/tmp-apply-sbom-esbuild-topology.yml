name: Temporary SBOM esbuild topology applicator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-apply-sbom-esbuild-topology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/fix-sbom-esbuild-topology
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Declare the Astro esbuild peer at the workspace root
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies.esbuild = '0.28.1';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const inventoryPath = 'project-docs/quality/dependency-inventory.json';
          const inventory = JSON.parse(fs.readFileSync(inventoryPath, 'utf8'));
          if (!inventory.entries.some((entry) => entry.name === 'esbuild')) {
            const electronIndex = inventory.entries.findIndex(
              (entry) => entry.section === 'devDependencies' && entry.name === 'electron',
            );
            inventory.entries.splice(electronIndex + 1, 0, {
              name: 'esbuild',
              section: 'devDependencies',
              range: '0.28.1',
              purpose: 'Workspace peer for Astro and Vite 8 while Classic Vite retains its nested compiler',
              owner: 'desktop-maintainers',
              updateCadence: 'monthly-security-review',
            });
          }
          fs.writeFileSync(inventoryPath, `${JSON.stringify(inventory, null, 2)}\n`);
          NODE
      - name: Regenerate the public npm lockfile
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Verify compiler topology and CycloneDX generation
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const rootEsbuild = lock.packages['node_modules/esbuild']?.version;
          const classicEsbuild = lock.packages['node_modules/vite/node_modules/esbuild']?.version;
          if (rootEsbuild !== '0.28.1') throw new Error(`unexpected root esbuild ${rootEsbuild}`);
          if (!classicEsbuild?.startsWith('0.21.')) {
            throw new Error(`Classic Vite compiler was not isolated: ${classicEsbuild}`);
          }
          NODE
          npm sbom --sbom-format cyclonedx --json > /tmp/sbom.cdx.json
          node -e "const sbom=require('/tmp/sbom.cdx.json'); if (sbom.bomFormat !== 'CycloneDX') throw new Error('invalid SBOM')"
      - name: Format dependency declarations
        run: npm run format:write
      - name: Commit dependency topology fix
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json project-docs/quality/dependency-inventory.json
          git commit -m 'Isolate Astro and Classic esbuild compiler versions'
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Execute complete repository quality gate
        run: npm run verify
      - name: Require clean verified tree
        run: git diff --exit-code && test -z "$(git status --short)"
      - name: Push verified dependency fix
        run: git push origin HEAD:agent/fix-sbom-esbuild-topology

  receipt:
    if: always()
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/sbom-esbuild-topology-receipt
          fetch-depth: 0
      - name: Record applicator result
        env:
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.apply.result }}
          VERIFIED_SHA: ${{ needs.apply.outputs.commit_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.sbom-esbuild-topology.json', `${JSON.stringify({
            runId: Number(process.env.RUN_ID),
            result: process.env.RESULT,
            verifiedCommitSha: process.env.VERIFIED_SHA || null,
            triggerSha: process.env.TRIGGER_SHA,
            targetBranch: 'agent/fix-sbom-esbuild-topology',
            recordedAt: new Date().toISOString(),
          }, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .sbom-esbuild-topology.json
          git commit -m "Record SBOM topology applicator ${RUN_ID}"
          git pull --rebase origin ops/sbom-esbuild-topology-receipt
          git push origin HEAD:ops/sbom-esbuild-topology-receipt
