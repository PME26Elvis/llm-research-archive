name: Temporary Finalize PR29

on:
  push:
    branches:
      - agent/desktop-import-wizard

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/desktop-import-wizard
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply final implementation
        shell: bash
        run: |
          set -euo pipefail
          npm run format:write
          cat scripts/.pr29-final-patch-00 scripts/.pr29-final-patch-01 > /tmp/pr29.patch
          patch --batch --forward -p1 < /tmp/pr29.patch
          npm run format:write
          rm -f \
            .github/workflows/tmp-source-snapshot.yml \
            .github/workflows/tmp-finalize-pr29.yml \
            .tmp-source-snapshot-trigger \
            scripts/.pr29-payload-00 \
            scripts/.pr29-final-patch-00 \
            scripts/.pr29-final-patch-01
          git diff --check
      - name: Verify final tree
        run: npm run verify
      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Desktop Import Wizard'
          git push origin HEAD:agent/desktop-import-wizard
