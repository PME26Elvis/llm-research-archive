name: Temporary v0.1.4 release inspector

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v0.1.4-release-inspector.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/v0.1.4-release-inspector-receipt
          fetch-depth: 0
      - name: Record recent v0.1.4 release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Temporary Mermaid and Astro prerelease publisher" \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url \
            > .v0.1.4-release-runs.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v0.1.4-release-runs.json
          git commit -m "Record v0.1.4 release run status ${GITHUB_RUN_ID}"
          git pull --rebase origin ops/v0.1.4-release-inspector-receipt
          git push origin HEAD:ops/v0.1.4-release-inspector-receipt
