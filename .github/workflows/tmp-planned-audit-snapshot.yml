name: Temporary Planned Audit Snapshot
run-name: Capture app-main planned audit snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-planned-audit-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event.head_commit.message == 'Capture app-main planned audit snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: app-main
          fetch-depth: 1
      - name: Package source snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          zip -qr /tmp/planned-audit-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'out/*' 'coverage/*' 'playwright-report/*' 'test-results/*'
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planned-audit-source
          path: /tmp/planned-audit-source.zip
          if-no-files-found: error
          retention-days: 3
      - name: Checkout receipt branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/planned-audit-receipt
          path: receipt
          fetch-depth: 0
      - name: Publish snapshot receipt
        env:
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
          SNAPSHOT_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.SNAPSHOT_RUN_ID),
            sourceSha: process.env.SNAPSHOT_SOURCE_SHA,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('receipt/.planned-audit-snapshot.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git -C receipt config user.name github-actions[bot]
          git -C receipt config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C receipt add .planned-audit-snapshot.json
          git -C receipt commit -m "Record planned audit snapshot ${SNAPSHOT_RUN_ID}"
          git -C receipt push origin HEAD:ops/planned-audit-receipt
