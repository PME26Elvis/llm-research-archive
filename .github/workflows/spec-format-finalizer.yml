name: Finalize Specification Formatting
on:
  pull_request:
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'agent/specification-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/specification-convergence
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - name: Verify formatter scope
        shell: bash
        run: |
          allowed='^(project-docs/product/desktop-product-spec.md|project-docs/product/desktop-requirement-catalog.md|project-docs/quality/acceptance-matrix.md|project-docs/traceability/requirements.yaml|scripts/validate-traceability.mjs|.github/workflows/spec-format-finalizer.yml)$'
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
      - run: rm .github/workflows/spec-format-finalizer.yml
      - name: Commit formatted specification
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add project-docs/product/desktop-product-spec.md \
            project-docs/product/desktop-requirement-catalog.md \
            project-docs/quality/acceptance-matrix.md \
            project-docs/traceability/requirements.yaml \
            scripts/validate-traceability.mjs \
            .github/workflows/spec-format-finalizer.yml
          git commit -m "Format specification convergence changes"
          git push origin HEAD:agent/specification-convergence
