name: Temporary Mermaid and Astro prerelease publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v0.1.4-mermaid-astro-release.yml

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: PME26Elvis/llm-research-archive/.github/workflows/desktop-release-reusable.yml@app-main
    with:
      target_ref: app-main
      requested_version: '0.1.4'
      release_notes: |
        Repair Mermaid rendering for BOM, CRLF, punctuation-heavy legacy flowcharts, and nested scroll layouts
        Validate every bundled Mermaid fence in real Electron alongside flowchart, sequence, state, class, ER, invalid-source, and sanitizer coverage
        Preserve strict offline Mermaid security while improving SVG compatibility, theme rerendering, and stale-render cleanup
        Add the complete proposed Astro frontend refactor specification, ADR-0020, phased migration plan, acceptance gates, and rollback strategy
        Synchronize desktop architecture, testing strategy, Mermaid ADR, and roadmap documentation
      channel: prerelease
      publish: true

  receipt:
    if: always()
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/v0.1.4-release-receipt
          fetch-depth: 0
      - name: Record release result
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.RELEASE_RUN_ID),
            result: process.env.RELEASE_RESULT,
            triggerSha: process.env.RELEASE_TRIGGER_SHA,
            targetRef: 'app-main',
            expectedVersion: 'v0.1.4',
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.v0.1.4-release-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v0.1.4-release-receipt.json
          git commit -m "Record Mermaid and Astro prerelease ${RELEASE_RUN_ID}"
          git pull --rebase origin ops/v0.1.4-release-receipt
          git push origin HEAD:ops/v0.1.4-release-receipt
