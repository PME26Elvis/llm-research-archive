name: Temporary Quality Patch Inspector
run-name: Inspect enforced quality patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-runtime-quality-finalizer.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: startsWith(github.event.head_commit.message, 'Inspect enforced quality patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/planned-audit-receipt
          fetch-depth: 0
      - name: Capture patch failure
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '86737803183'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/job.log
          grep -E 'error:|corrupt patch|patch failed|does not apply|No such file' /tmp/job.log \
            > .quality-patch-error.log || true
          tail -n 80 /tmp/job.log > .quality-patch-tail.log
      - name: Publish diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .quality-patch-error.log .quality-patch-tail.log
          git commit -m "Record enforced quality patch diagnostics"
          git pull --rebase origin ops/planned-audit-receipt
          git push origin HEAD:ops/planned-audit-receipt
