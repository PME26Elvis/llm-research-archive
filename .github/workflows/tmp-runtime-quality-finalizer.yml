name: Temporary Release Footprint Finalizer
run-name: Finalize release footprint enforcement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-runtime-quality-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.head_commit.message, 'Finalize release footprint enforcement')
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      push_result: ${{ steps.commit.outputs.push_result }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/enforced-quality-gates
          fetch-depth: 0
      - name: Checkout staged release patch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/planned-audit-receipt
          path: payload
          fetch-depth: 1
      - name: Apply release footprint patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check payload/.quality-gate-patches/06-release-workflow.diff
          git apply payload/.quality-gate-patches/06-release-workflow.diff
          rm -rf payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - name: Execute complete quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee release-footprint-verify.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-footprint-verification-${{ github.run_attempt }}
          path: |
            release-footprint-verify.log
            coverage/
            dist/quality/
            dist/performance/
          if-no-files-found: warn
          retention-days: 14
      - name: Create verified commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/desktop-release-reusable.yml scripts/validate-release-assets.mjs
          git commit -m "Enforce installed footprint in Desktop Release"
          commit_sha=$(git rev-parse HEAD)
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          set +e
          git push origin HEAD:agent/enforced-quality-gates
          push_status=$?
          set -e
          if [[ $push_status -eq 0 ]]; then
            echo 'push_result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'push_result=workflow-permission-rejected' >> "$GITHUB_OUTPUT"
          fi

  receipt:
    if: always() && startsWith(github.event.head_commit.message, 'Finalize release footprint enforcement')
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/planned-audit-receipt
          fetch-depth: 0
      - name: Record finalizer result
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
          FINALIZER_RESULT: ${{ needs.finalize.result }}
          VERIFIED_COMMIT_SHA: ${{ needs.finalize.outputs.commit_sha }}
          PUSH_RESULT: ${{ needs.finalize.outputs.push_result }}
          FINALIZER_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.FINALIZER_RUN_ID),
            result: process.env.FINALIZER_RESULT,
            verifiedCommitSha: process.env.VERIFIED_COMMIT_SHA || null,
            pushResult: process.env.PUSH_RESULT || null,
            triggerSha: process.env.FINALIZER_TRIGGER_SHA,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.release-footprint-finalizer.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-footprint-finalizer.json
          git commit -m "Record release footprint finalizer ${FINALIZER_RUN_ID}"
          git pull --rebase origin ops/planned-audit-receipt
          git push origin HEAD:ops/planned-audit-receipt
