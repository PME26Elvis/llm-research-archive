name: Temporary Completed Quality Docs Finalizer
run-name: Run adaptive completed quality documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-runtime-quality-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.head_commit.message, 'Run adaptive completed quality documentation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: agent/sync-completed-quality-docs
          fetch-depth: 0
      - name: Checkout staged documentation payload
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/docs-sync-payload
          path: payload
          fetch-depth: 1
      - name: Reconstruct and apply documentation convergence atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('payload/.docs-sync-patch')
          expected_parts = [
              (16000, 'd182356afcf5c67937cd3ce09673c08d6de594ca35ac50b53b27270a5831a00d'),
              (16000, 'c0f87d57cc7e82cfd641f07ef72cf592d311cdbd5b37a9a5623ca955c6d7f561'),
              (16000, '160992af5282472a275313644ce6a6799960c8aa9a202f20c16cd83363996807'),
              (14801, '1fe8d88f2a07970022e217a14862fdb02830a24ad246411a3e15df98caf80115'),
          ]
          verified = []
          diagnostics = []
          for index, (expected_size, expected_digest) in enumerate(expected_parts):
              path = root / f'part-{index:02d}.diff'
              data = path.read_bytes()
              actual_digest = sha256(data).hexdigest()
              if len(data) == expected_size and actual_digest == expected_digest:
                  verified.append(data)
                  diagnostics.append(f'{path.name}: exact {len(data)} {actual_digest}')
                  continue
              if (
                  len(data) == expected_size + 1
                  and data.endswith(b'\n')
                  and sha256(data[:-1]).hexdigest() == expected_digest
              ):
                  verified.append(data[:-1])
                  diagnostics.append(f'{path.name}: removed API LF {len(data)} -> {expected_size}')
                  continue
              raise SystemExit(
                  f'{path.name} mismatch: size={len(data)} sha256={actual_digest}; '
                  f'expected size={expected_size} sha256={expected_digest}'
              )
          combined = b''.join(verified)
          digest = sha256(combined).hexdigest()
          expected = '74d3fb4d1c8a0e1fc02cde6030c3788ebfe1983674d620f8ee2ecad693f418b3'
          Path('docs-patch-digest.txt').write_text('\n'.join(diagnostics + [f'combined: {len(combined)} {digest}']) + '\n')
          if digest != expected:
              raise SystemExit(f'documentation patch digest mismatch: {digest} != {expected}')
          Path('/tmp/docs-sync.patch').write_bytes(combined)
          print('\n'.join(diagnostics))
          print(f'documentation patch verified: {digest}')
          PY
          if git apply --check /tmp/docs-sync.patch 2>docs-apply.log; then
            git apply /tmp/docs-sync.patch
            echo 'strict apply succeeded' >> docs-apply.log
          else
            echo 'strict apply failed; attempting three-way apply' | tee -a docs-apply.log
            git apply --3way /tmp/docs-sync.patch 2>&1 | tee -a docs-apply.log
          fi
          mkdir -p project-docs/architecture/adr project-docs/roadmap
          cp payload/.docs-sync-patch/new-adr-0018.md \
            project-docs/architecture/adr/0018-enforced-quality-and-local-observability.md
          cp payload/.docs-sync-patch/new-desktop-roadmap.md \
            project-docs/roadmap/desktop-roadmap.md
          rm -rf payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - name: Validate traceability convergence
        run: npm run validate:traceability
      - name: Execute complete repository gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee docs-sync-verify.log
      - name: Publish verified documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs project-docs
          git commit -m "Synchronize completed desktop quality documentation"
          git push origin HEAD:agent/sync-completed-quality-docs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-quality-docs-verification-${{ github.run_attempt }}
          path: |
            docs-apply.log
            docs-patch-digest.txt
            docs-sync-verify.log
            coverage/
            dist/quality/
            dist/performance/
          if-no-files-found: warn
          retention-days: 14

  receipt:
    if: always() && startsWith(github.event.head_commit.message, 'Run adaptive completed quality documentation')
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/docs-sync-payload
          fetch-depth: 0
      - name: Record finalizer result
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
          FINALIZER_RESULT: ${{ needs.finalize.result }}
          FINALIZER_TRIGGER_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            runId: Number(process.env.FINALIZER_RUN_ID),
            result: process.env.FINALIZER_RESULT,
            triggerSha: process.env.FINALIZER_TRIGGER_SHA,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.docs-sync-finalizer.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .docs-sync-finalizer.json
          git commit -m "Record documentation finalizer ${FINALIZER_RUN_ID}"
          git pull --rebase origin ops/docs-sync-payload
          git push origin HEAD:ops/docs-sync-payload
