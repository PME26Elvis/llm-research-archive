name: Temporary Package Footprint Inspector
run-name: Inspect macOS package footprint failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-runtime-quality-finalizer.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: startsWith(github.event.head_commit.message, 'Inspect macOS package footprint failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/planned-audit-receipt
          fetch-depth: 0
      - name: Capture macOS footprint diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '86743430252'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/macos-footprint.log
          grep -iE 'footprint|forbidden|budget|asar|error|failed|bytes|packageRoot|totalBytes' /tmp/macos-footprint.log \
            > .macos-footprint-errors.log || true
          tail -n 180 /tmp/macos-footprint.log > .macos-footprint-tail.log
      - name: Publish diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .macos-footprint-errors.log .macos-footprint-tail.log
          git commit -m "Record macOS package footprint diagnostics"
          git pull --rebase origin ops/planned-audit-receipt
          git push origin HEAD:ops/planned-audit-receipt
