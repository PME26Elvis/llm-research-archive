name: Inspect Deep Research applicator

on:
  pull_request:
    paths:
      - .github/workflows/inspect-deep-research-applicator.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture latest applicator push failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/87937202170/logs" > applicator-job.log
          tail -n 180 applicator-job.log

      - name: Upload applicator inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-research-applicator-inspection
          path: applicator-job.log
          if-no-files-found: error
          retention-days: 7
