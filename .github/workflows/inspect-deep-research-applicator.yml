name: Inspect Deep Research applicator

on:
  pull_request:
    paths:
      - .github/workflows/inspect-deep-research-applicator.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture latest macOS arm64 package-smoke failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/87942990197/logs" > package-smoke-arm64.log
          tail -n 220 package-smoke-arm64.log

      - name: Upload package-smoke inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-research-applicator-inspection
          path: package-smoke-arm64.log
          if-no-files-found: error
          retention-days: 7
