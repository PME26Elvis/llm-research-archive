name: Release Run Inspector
run-name: Capture release finalizer push diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-run-inspector.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'Capture release finalizer push diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/fresh-release-recovery
          fetch-depth: 0
      - name: Capture finalizer log tail
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_JOB_ID: '86722508394'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FINALIZER_JOB_ID}/logs" > /tmp/finalizer.log
          tail -n 100 /tmp/finalizer.log > .release-finalizer-tail.log
          grep -iE 'error|failed|rejected|refusing|remote:|workflow|commit|push' /tmp/finalizer.log \
            > .release-finalizer-errors.log || true
      - name: Publish inspector result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-finalizer-tail.log .release-finalizer-errors.log
          git commit -m "Record release finalizer push diagnostics"
          git pull --rebase origin fix/fresh-release-recovery
          git push origin HEAD:fix/fresh-release-recovery
