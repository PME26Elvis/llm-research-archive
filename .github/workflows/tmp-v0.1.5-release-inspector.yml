name: Temporary v0.1.5 release inspector

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v0.1.5-release-inspector.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ops/v0.1.5-release-inspector-receipt
          fetch-depth: 0
      - name: Record active release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Temporary Astro dual-renderer prerelease publisher" --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > .v0.1.5-release-inspector.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v0.1.5-release-inspector.json
          git commit -m "Inspect v0.1.5 release ${run_id}"
          git pull --rebase origin ops/v0.1.5-release-inspector-receipt
          git push origin HEAD:ops/v0.1.5-release-inspector-receipt
